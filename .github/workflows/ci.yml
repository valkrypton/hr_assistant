name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies (incl. dev group)
        run: uv sync

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Tests (pytest)
        # DEBUG=true is required: without it the production startup guards in
        # core/config.py raise at import time for a missing SECRET_KEY. This
        # mirrors how the suite runs locally.
        run: DEBUG=true uv run pytest --no-cov -q
